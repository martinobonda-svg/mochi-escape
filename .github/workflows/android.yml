name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'radura/**'
      - 'art/**'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build standalone WebView APK
        env:
          SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_CONFIG" ]; then
            echo '::error::Configure the ANDROID_SIGNING_CONFIG repository secret before building.'
            exit 1
          fi
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          BT="$SDK/build-tools/35.0.0"
          JAR="$SDK/platforms/android-35/android.jar"
          mkdir -p build/assets build/classes build/dex build/res/drawable
          node radura/prepare.cjs art build/assets/assets
          cp -R radura/islands build/assets/
          cp radura/companion-magic.js radura/album.css radura/wardrobe.js radura/wardrobe.css radura/journey.css radura/story-art.js radura/index.html radura/stage.js radura/voyage.js radura/archipelago.js radura/feedback.js radura/finish.css radura/puzzle.js radura/stage.css build/assets/
          mkdir -p build/res/drawable-nodpi
          cp radura/runa-icon.png build/res/drawable-nodpi/app_icon.png
          mkdir -p build/res/mipmap-anydpi-v26 build/res/mipmap-nodpi
          cp radura/runa-icon.png build/res/mipmap-nodpi/launcher.png
          cat > build/res/mipmap-anydpi-v26/launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/black"/>
            <foreground android:drawable="@drawable/app_icon"/>
          </adaptive-icon>
          EOF
          cat > build/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.mochiescape.puzzle" android:versionCode="27" android:versionName="0.0.7">
            <uses-sdk android:minSdkVersion="23" android:targetSdkVersion="35"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="Mochi Escape" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:allowBackup="false" android:icon="@mipmap/launcher" android:roundIcon="@mipmap/launcher">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > build/MainActivity.java <<'EOF'
          package com.mochiescape.puzzle;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          public class MainActivity extends Activity {
            WebView game;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              game = new WebView(this);
              game.setWebViewClient(new WebViewClient(){ @Override public boolean shouldOverrideUrlLoading(WebView view,String url){return true;} });
              game.addJavascriptInterface(new Object(){ @android.webkit.JavascriptInterface public void pulse(boolean strong){runOnUiThread(()->game.performHapticFeedback(strong?android.view.HapticFeedbackConstants.LONG_PRESS:android.view.HapticFeedbackConstants.VIRTUAL_KEY));} },"PipTouch");
              game.getSettings().setJavaScriptEnabled(true);
              game.getSettings().setDomStorageEnabled(true);
              game.getSettings().setAllowFileAccess(true);
              game.getSettings().setAllowContentAccess(false);
              game.getSettings().setMediaPlaybackRequiresUserGesture(false);
              setContentView(game);
              getWindow().getDecorView().setSystemUiVisibility(5894);
              game.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onBackPressed(){
                game.evaluateJavascript("typeof handleBack === 'function' && handleBack()", value -> {
                  if (!"true".equals(value)) finish();
                });
              }
              @Override protected void onPause(){super.onPause();if(game!=null){game.onPause();game.pauseTimers();}}
            @Override protected void onResume(){super.onResume();if(game!=null){game.onResume();game.resumeTimers();}}
          }
          EOF
          node -e 'const fs=require("fs"),vm=require("vm"); const h=fs.readFileSync("build/assets/index.html","utf8"); for(const x of h.matchAll(/<script>([\s\S]*?)<\/script>/g)) new vm.Script(x[1]);'
          javac -source 8 -target 8 -classpath "$JAR" -d build/classes build/MainActivity.java
          "$BT/d8" --lib "$JAR" --min-api 23 --output build/dex build/classes/com/mochiescape/puzzle/*.class
          "$BT/aapt2" compile --dir build/res -o build/resources.zip
          "$BT/aapt2" link -I "$JAR" --manifest build/AndroidManifest.xml -A build/assets -o build/unsigned.apk build/resources.zip
          (cd build/dex && zip -j ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          umask 077
          trap 'rm -f build/signing.p12' EXIT
          python3 - <<'PY'
          import base64, json, os
          cfg = json.loads(os.environ["SIGNING_CONFIG"])
          with open("build/signing.p12", "wb") as f:
              f.write(base64.b64decode(cfg["keystore"], validate=True))
          PY
          export KS_PASS="$(python3 -c 'import json, os; print(json.loads(os.environ["SIGNING_CONFIG"])["password"])')"
          echo "::add-mask::$KS_PASS"
          unset SIGNING_CONFIG
          "$BT/apksigner" sign --ks build/signing.p12 --ks-key-alias game-release --ks-pass env:KS_PASS --key-pass env:KS_PASS --out build/MOCHI-ESCAPE-0.0.7.apk build/aligned.apk
          unset KS_PASS
          "$BT/apksigner" verify --verbose --print-certs build/MOCHI-ESCAPE-0.0.7.apk | tee build/cert-check.txt
          grep -Fqi 'certificate SHA-256 digest: 1664981479dbabd55fd7801fc1251d4c17d09eee20dd32176896f3910b7016a7' build/cert-check.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MOCHI-ESCAPE-Android-VV-0.0.7
          path: build/MOCHI-ESCAPE-0.0.7.apk
      - name: Publish direct APK for testing
        if: github.ref == 'refs/heads/codex/mochi-0.0.7-update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mochi-update-0.0.7-${{ github.run_id }}" "build/MOCHI-ESCAPE-0.0.7.apk" --title "MOCHI-ESCAPE 0.0.7 Android test" --notes "Illustrated visual update. Persistent signing certificate checked. Not a Google Play release." --prerelease








