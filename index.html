/* Premium UI pass: live components, not a flattened screenshot. */
#playScreen{padding:6px 6.5% 10px;gap:6px;background-size:cover}
#playScreen .brand{height:clamp(48px,8.5dvh,75px);margin:0 -6%}
#playScreen .corner{top:5px;min-width:36px;min-height:36px}
#playScreen #stageBanner{margin:0 2%;padding:5px 8px}
#stageBanner:before,#stageBanner:after{content:'';display:inline-block;width:22px;height:20px;vertical-align:middle;background:var(--foliage) center/contain no-repeat;margin:0 5px}
#playScreen header{margin:0 -3%;align-items:center}
#playScreen header .badge{min-height:55px;flex:1;border-radius:20px}
#moves strong{font-size:clamp(29px,7vw,42px);line-height:1}
#level:after{content:'';width:24px;height:28px;flex-shrink:0;background:var(--mochi-art) center/contain no-repeat}
.scorePanel{position:relative;padding-top:12px}
#liveStars{position:absolute;z-index:2;top:0;left:0;right:0;display:flex;justify-content:center;gap:3px}
#liveStars img{width:24%;max-width:29px;filter:drop-shadow(0 2px 2px #78440088)}
.scorePanel .game-progress{height:19px;border:3px solid #fff4d1;box-shadow:0 2px #9d6a35,inset 0 2px 4px #55452d}
.scorePanel .game-progress i{background:linear-gradient(#d4ff75,#62cf14 40%,#319b09 80%,#a6ef44)}
#playScreen .board-wrap{padding:6px;margin:2px 0;border-radius:24px}
#playScreen #board{gap:2px;padding:3px;background:#48632b}
#playScreen #status{margin-top:0;border-radius:18px 18px 0 0;background:#fff0d6;padding:6px 9px}
#playScreen .tray{margin-top:-6px;border-radius:0 0 22px 22px;padding:21px 6px 8px;background:linear-gradient(#fff0d6,#efd1a0)}
#playScreen .tray:before{top:1px;background:none;font-size:13px;font-weight:900}
#playScreen .piece{height:clamp(53px,10dvh,83px);border-radius:16px}
#playScreen .controls{margin:3px -4% 0}
#playScreen .controls button,#returnHome{display:flex!important;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px #89633c,inset 0 2px #fff9e8,0 5px 7px #34260d44}
#playScreen #hint{background:linear-gradient(#c6ff67,#6bd820 38%,#38a906 75%,#73d82a);color:white;text-shadow:0 1px 2px #245e17}
.premium-icon{width:19px;height:19px;object-fit:contain;flex-shrink:0}
#playScreen footer{opacity:1;font-size:0}
#playScreen .homeBack{font-size:14px;padding:5px 14px;border-radius:24px}
#overlay.victory{background:#24371525;padding:16px}
#overlay.victory .modal{position:relative;overflow:visible;width:min(330px,91vw);padding:62px 17px 20px;margin-top:55px;background:var(--flowers) bottom left/90px auto no-repeat,var(--flowers) bottom right/90px auto no-repeat,linear-gradient(#fff8df,#ffe9b8);border:4px solid #fff5d4;box-shadow:0 0 0 2px #c38b3b,0 7px #ad7843,0 14px 28px #39250d66;animation:premiumEnter .35s ease-out}
#overlay.victory #modalArt{position:absolute;top:-85px;height:145px;left:0;right:0;background:var(--foliage) bottom left/46% auto no-repeat,var(--foliage) bottom right/46% auto no-repeat,radial-gradient(ellipse,#ffe85f99,transparent 65%);pointer-events:none}
#overlay.victory .win-art{width:120px;height:120px;animation:premiumHop 1.4s infinite ease-in-out;filter:drop-shadow(0 0 10px #ffe977)}
#overlay.victory h2{position:relative;margin:0 -25px 10px;padding:12px 5px;background:linear-gradient(#fff5cf,#f6c577);border:2px solid #ac7138;border-radius:50% 50% 18% 18%/22% 22% 15% 15%;box-shadow:0 4px #b57e3d,inset 0 2px #fff8df;font-size:clamp(25px,8vw,38px);font-weight:1000}
#overlay.victory p{font-size:15px;font-weight:850;margin:12px 0;color:#694022}
#overlay.victory .star-result{gap:9px;margin:15px 0}
.star-result img{width:24%;max-width:63px;filter:drop-shadow(0 3px 2px #80491c77);animation:premiumEnter .45s backwards}
.star-result img:nth-child(2){animation-delay:.12s}.star-result img:nth-child(3){animation-delay:.24s}
.star-result img.unearned,#liveStars img.unearned{filter:grayscale(1) brightness(1.15)}
#overlay.victory #ok{border-radius:30px;background:linear-gradient(#fff798,#ffd42a 35%,#ffb400 75%,#ffdc3c);color:#62300d;font-size:24px;font-weight:1000;border:2px solid #a76b1b;box-shadow:inset 0 3px #fffbd4,0 4px #b56e16,0 6px 10px #69401755}
@keyframes premiumEnter{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes premiumHop{50%{transform:translateY(-9px) rotate(-5deg)}}
@media(max-height:700px){#playScreen{gap:4px;padding-top:3px}#playScreen .brand{height:44px}#playScreen header .badge{min-height:43px}#playScreen .piece{height:48px}#playScreen #status{font-size:10px;padding:3px}#playScreen .tray{padding-top:17px}#playScreen .controls button{min-height:32px}}
@media(prefers-reduced-motion:reduce){#overlay.victory .modal,#overlay.victory .win-art,.star-result img{animation:none}}

/* Garden and world map */
.garden{--route:#fff3cb;--route-edge:#c59b60;max-width:670px;width:100%;box-sizing:border-box;padding:clamp(10px,3vw,24px);padding-bottom:max(18px,env(safe-area-inset-bottom));gap:12px;overflow:visible;background:radial-gradient(ellipse at 45% 12%,#e6f1ba,transparent 55%),linear-gradient(155deg,#8fbb70,#c7dfa5 48%,#699579);color:#273b23}
.garden[data-theme=snow]{--route:#eefbff;--route-edge:#8cb9d0;background:radial-gradient(ellipse at top,#f7feff,transparent 60%),linear-gradient(152deg,#aacce1,#dceff7 50%,#90b8ce);color:#21445d}
.gardenBrand{height:clamp(58px,18vw,104px)}
.gardenBrand img{width:min(56vw,235px);height:100%;object-fit:contain}
.worldstrip{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.worldstrip button,.worldstrip button:first-child{font-size:clamp(11px,3.4vw,15px);min-height:46px;border-radius:15px;outline:0;background:#fff7df;box-shadow:0 3px #54725b;padding:6px}
.worldstrip button[aria-pressed=true]{background:#ffe7a2;outline:2px solid #a87335}
.mapPaging strong{text-align:center;font-size:clamp(12px,3.8vw,18px)}
.trailmap{box-sizing:border-box;width:100%;height:clamp(355px,110vw,540px);border-radius:24px;border:3px solid #fff3c9;background:linear-gradient(25deg,#345d2a66,#d5f8ac22),var(--forestScene,linear-gradient(#74ab54,#a6cf7a)) center/cover}
[data-theme=snow] .trailmap,#playScreen[data-theme=snow]{background:radial-gradient(circle at 10% 17%,white 0 2px,transparent 3px) 0 0/51px 63px,radial-gradient(circle at 63% 37%,#f7fdff 0 1px,transparent 2px) 0 0/71px 55px,linear-gradient(144deg,#d8f5ff 12%,transparent 12% 62%,#f0fcff 62%) center/cover,linear-gradient(218deg,#7aaccb 33%,#c1e1ef 34%,#5683a5 56%,#a0c9df 57%,#edfaff 83%)}
.trailmap button{z-index:1;width:clamp(64px,23%,117px);min-height:40px;border-radius:19px;font-size:clamp(14px,4vw,19px)}
.trailmap button:disabled{background:#e3e7dc;color:#46564b;box-shadow:0 3px #657c70}
.gardenCard{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;column-gap:12px;text-align:left;padding:12px 14px}
.gardenCard .chapter,.gardenCard .primary{grid-column:1/-1}
.gardenCard .gardenPet{grid-row:2/5;width:64px;height:64px;animation:none}
.gardenCard h2{font-size:clamp(18px,5vw,24px)}
.gardenCard .gardenStats{margin:4px 0 8px;font-size:12px}
.gardenNav{position:static!important;grid-template-columns:repeat(auto-fit,minmax(103px,1fr));padding:0!important}
.gardenNav button{min-height:44px;overflow-wrap:anywhere}
#playScreen[data-theme=snow] .cell:not(.block){background:radial-gradient(ellipse at 35% 25%,#dcf7ff,#93bed5);box-shadow:inset 0 0 6px #44799c55}
#playScreen[data-theme=snow] #board{background:#5b8399}
.hero img{animation:none}
.hero.run img{animation:softHop .18s ease-in-out infinite}
@keyframes softHop{0%,100%{transform:translateY(0) scale(1.035,.97)}45%{transform:translateY(-11%) scale(.99,1.02)}}
#overlay.victory .modal{width:min(280px,84vw);max-height:calc(100dvh - 82px);overflow:auto;padding:6px 13px 16px;margin-top:0;background-size:52px auto,52px auto,auto}
#overlay.victory #modalArt{position:relative;inset:auto;height:clamp(52px,13dvh,83px);background-size:32% auto,32% auto,auto}
#overlay.victory .win-art{width:auto;height:100%;animation:none}
#overlay.victory h2{margin:0 -9px 6px;padding:6px;font-size:clamp(21px,6vw,28px)}
#overlay.victory p{margin:8px 0;font-size:clamp(12px,3.7vw,14px)}
#overlay.victory .star-result{margin:8px 0}
#overlay.victory .star-result img{width:clamp(32px,11vw,45px);height:auto}
#overlay.victory #ok{font-size:18px;min-height:42px;padding:6px 12px}

#level:after{content:none}
.mochi-rig{display:block;width:100%;height:100%;overflow:visible;--coat:#fff0df}
.mochi-rig[data-variant="1"]{--coat:#edf5cf}
.mochi-rig[data-variant="2"]{--coat:#f3e3ff}
.mochi-rig[data-variant="3"]{--coat:#e1f2ff}
.mochi-rig .mochi-coat{fill:var(--coat)}
.mochi-shadow{fill:#483225;opacity:.25;transform-origin:52px 87px}
.mochi-ear,.mochi-foot,.mochi-head,.mochi-torso,.mochi-eyes{transform-box:fill-box;transform-origin:center bottom}
.mochi-eyes{animation:mochi-blink 5s 2s infinite}
.mochi-badge{width:27px;height:27px;flex:none}
.collectionCards .mochi-rig{width:66px;height:66px}
#overlay.victory .mochi-rig{width:auto;height:100%;margin:auto;filter:drop-shadow(0 0 8px #ffdf72)}
.hero .mochi-rig{width:108%;height:108%}
.hero[data-facing=left] .mochi-rig{scale:-1 1}
.hero.run .mochi-torso{animation:mochi-stride .18s infinite ease-in-out}
.hero.run .mochi-ear{animation:mochi-flop .18s infinite ease-in-out}
.hero.run .mochi-ear.far{animation-delay:-.035s}
.hero.run .mochi-foot{animation:mochi-kick .18s infinite ease-in-out}
.hero.run .mochi-foot.back{animation-delay:-.09s}
.hero.run .mochi-shadow{animation:mochi-shadow-step .18s infinite ease-in-out}
.mochi-win .mochi-head{animation:mochi-cheer .55s ease-out 1}
@keyframes mochi-stride{0%,100%{transform:scale(1.08,.91)}48%{transform:translateY(-8px) scale(.98,1.03)}}
@keyframes mochi-flop{0%,100%{transform:rotate(8deg)}45%{transform:rotate(-13deg)}}
@keyframes mochi-kick{50%{transform:translateX(3px) rotate(-21deg)}}
@keyframes mochi-shadow-step{50%{transform:scale(.78);opacity:.14}}
@keyframes mochi-blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
@keyframes mochi-cheer{25%{transform:rotate(-8deg) translateY(-4px)}70%{transform:rotate(4deg)}}

body:has(#garden:not([hidden])){overflow:hidden}
#garden{height:100dvh;min-height:0;max-width:780px;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:clamp(4px,1.5dvh,12px);padding:clamp(6px,1.8dvh,17px) clamp(8px,3vw,25px);overflow:hidden}
#garden .gardenBrand{height:clamp(30px,10dvh,90px)}
#garden .worldstrip button{min-height:34px}
#garden .mapPaging button{min-height:30px;padding:3px 13px}
#garden .trailmap{height:100%;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));align-items:center;gap:4px;padding:9px}
#garden .trailmap button{position:relative;inset:auto;transform:none;width:100%;min-width:0;min-height:34px;font-size:clamp(12px,3.7vw,19px);padding:2px}

#garden .trailmap button:nth-child(-n+5){grid-row:2}
.homeAction{background:#fff4d7;border:2px solid #bd9a64;border-radius:15px;padding:6px 9px;margin:0}
.homeAction p{font-size:clamp(11px,3.3vw,15px);margin:0 0 5px}
.homeAction button{min-height:36px;font-size:17px;padding:4px 8px}
#garden .gardenNav{grid-template-columns:repeat(3,minmax(0,1fr));background:none;gap:6px}
#garden .gardenNav button{font-size:clamp(12px,3.8vw,17px);min-height:38px}
#garden .gardenNav button[aria-current=page]{background:#ffda77;outline:2px solid #a97037}
#garden[data-tab]:not([data-tab=home]){grid-template-rows:auto minmax(0,1fr) auto}
.lobbyPanel{overflow:auto;min-height:0;background:#fff4da;border:2px solid #be9a63;border-radius:16px;padding:10px}

.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:10px}

.roster small{display:block}
.hero{transition:none}

#garden .worldstrip{grid-template-columns:repeat(3,minmax(0,1fr))}

.journey-pip{position:absolute;display:block;width:clamp(38px,11vw,68px);height:auto;aspect-ratio:1;bottom:71%;left:50%;transform:translateX(-50%);filter:drop-shadow(0 3px 2px #1e253c80)}
#garden #trailmap .journey-index{position:absolute;bottom:4%;right:3%;left:auto;top:auto;width:auto;min-height:33px;padding:3px 9px;font-size:12px}

@keyframes journey-land{from{background-position:left 36%}to{background-position:left center}}

/* Full-bleed journey. Nodes and Pip are live elements over the environment. */
html,body{width:100%;height:100%;margin:0;overscroll-behavior:none;background:#151733}
body:has(#garden:not([hidden])){overflow:hidden}
#garden{position:relative;isolation:isolate;width:100%;height:100dvh;max-width:none;padding:0;display:block;overflow:hidden;background:#23254f}
#garden .gardenBrand{position:absolute;z-index:5;top:max(4px,env(safe-area-inset-top));left:12%;right:12%;height:clamp(48px,9dvh,78px);background:linear-gradient(#fce6bc,#d59e63);border:3px solid #fff0cf;box-shadow:0 4px #784b30;border-radius:43% 43% 26% 26%;pointer-events:none}
#garden .gardenBrand img{display:none}
#gardenTitle,#gardenTitle[hidden]{display:block!important;font:bold clamp(24px,7.2vw,46px) Georgia,serif;color:#57301e;text-shadow:0 1px #fff6d4;margin:0}
#garden[data-tab=home] #trailmap{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;padding:0;box-shadow:none;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;background:#242650}
#garden #journeyScene{position:relative;height:clamp(1350px,230dvh,2500px);background:var(--journey-art) left center/300% 100% no-repeat}
#garden #journeyScene::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 25%,#fff7bb 1px,transparent 2px) 0 0/79px 83px,radial-gradient(circle at 50% 38%,#edb9ff 1px,transparent 2px) 11px 18px/119px 105px;animation:ambient-stars 8s ease-in-out infinite}
@keyframes ambient-stars{50%{opacity:.25;transform:translateY(10px)}}
#garden #trailmap .journey-stop{left:var(--stop-x);top:var(--stop-y);width:clamp(38px,12vw,75px);height:auto;aspect-ratio:.92;min-height:0;transform:translate(-50%,-50%) scale(var(--stop-size));border:2px solid #9e96ad;border-radius:48% 48% 27% 27%/41% 41% 22% 22%;background:linear-gradient(145deg,#716985,#403d57);box-shadow:0 4px #25243b,0 7px 8px #211c3970;color:#e3dcee;opacity:1;display:grid;place-content:center;gap:1px}
#garden #trailmap .journey-stop.lit{background:linear-gradient(145deg,#dba766,#8d603e);border-color:#f9d693;box-shadow:0 3px #73503b,0 0 14px #ffe47e88}
#garden #trailmap .journey-stop.next{background:linear-gradient(145deg,#ffe5a6,#b78047);border-color:#fff0ba;box-shadow:0 3px #895531,0 0 17px #ffd57488;color:#4f2f21}
.stop-star{font-size:clamp(17px,6vw,33px);line-height:.86;color:#434056;text-shadow:0 1px #a29db5}
.lit .stop-star,.next .stop-star{color:#ffdd70;text-shadow:0 0 8px #ffe16e,0 1px #a16b32}
#garden #trailmap .milestone{border-width:3px}
.journey-pip{width:clamp(67px,22vw,115px);bottom:70%;filter:drop-shadow(0 6px 5px #2015329f);z-index:2}
.pip-model{display:block;width:100%;height:100%;object-fit:contain}
#garden .gardenNav{position:absolute!important;left:clamp(6px,2vw,16px);right:clamp(6px,2vw,16px);bottom:max(6px,env(safe-area-inset-bottom));z-index:6;gap:3px}
#garden .gardenNav button{display:grid;align-content:center;border-radius:18px;border:2px solid #fff0cf;background:linear-gradient(#ffe9c6,#dba778);min-height:clamp(50px,9dvh,78px);box-shadow:0 4px #75472c;font:bold clamp(12px,4vw,22px) Georgia,serif;color:#462617}
#garden .gardenNav button span{font:900 clamp(18px,5.6vw,31px)/.92 Georgia,serif}
#garden .gardenNav button[aria-current=page]{background:linear-gradient(#ffe39b,#efa03b);outline:0}
#garden .lobbyPanel{position:absolute;inset:clamp(64px,12dvh,104px) 4vw clamp(66px,13dvh,105px);overflow:auto}
#playScreen{width:100%;max-width:none;min-height:100dvh;padding:max(7px,env(safe-area-inset-top)) 3vw max(10px,env(safe-area-inset-bottom));box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.25dvh,12px)}
#playScreen .brand{width:min(100%,620px);height:auto;min-height:clamp(38px,7dvh,68px);display:grid;grid-template-columns:35px minmax(0,1fr) 35px;align-items:center;gap:5px;margin:0}
#playScreen .brand .corner{position:static;font-size:22px;width:34px;height:34px;min-height:0;padding:0}
#playScreen #gameLogo{display:none}
#stageBanner,#playScreen #stageBanner{margin:0;font:bold clamp(17px,5vw,34px) Georgia,serif;background:linear-gradient(#ffeac4,#e8b27e);border:3px solid #fff0d0;border-radius:23px;color:#503022;box-shadow:0 4px #744b3f;padding:5px}
#playScreen header{display:flex;justify-content:center;min-height:0;margin:0;width:auto}
#playScreen #moves{min-height:0;padding:4px 13px;display:flex;flex-direction:row-reverse;gap:5px;align-items:center;background:#ffe8bc;border:2px solid #fff2d7;border-radius:22px;font:bold 15px Georgia,serif}
#playScreen #moves strong{font-size:17px}
#playScreen .board-wrap{width:min(94vw,54dvh,550px);max-width:none;box-sizing:border-box;margin:0}
#playScreen #board{width:100%;box-sizing:border-box}
#playScreen .tray{width:min(94vw,540px);max-width:none;margin:0;padding:5px;box-sizing:border-box;background:#eed2a6;border:2px solid #fff0d6;border-radius:17px;box-shadow:0 5px #79563c}
#playScreen .tray::before,#playScreen #stageName{display:none}
#playScreen .piece{height:clamp(43px,10dvh,82px);background:linear-gradient(#fae3c4,#e7c095);border-color:#b98e64;border-radius:12px}
#playScreen .controls{width:min(94vw,540px);gap:5px;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
#playScreen .controls button{font:bold clamp(11px,3.2vw,17px) Georgia,serif;padding:4px;min-height:37px;color:#4b2e20;background:linear-gradient(#ffe9c5,#d8a574);border:2px solid #fff0d5;border-radius:17px;box-shadow:0 4px #77503a}
#playScreen #hint{background:linear-gradient(#ffe29b,#efa13d)}
#playScreen .hero .pip-model{width:114%;height:114%;filter:drop-shadow(0 2px 2px #211626aa)}
#playScreen .cell.portal{position:relative;isolation:isolate;overflow:visible;background:#3a2e5b}
.portal-ring,.portal-swirl{position:absolute;border-radius:50%;pointer-events:none}
.portal-ring{inset:10% 17%;border:2px solid #e6b6ff;box-shadow:0 0 10px #dc7dff,inset 0 0 7px #8b44fc;background:radial-gradient(ellipse,#251147,#6223a4 75%);animation:portal-breathe 1.8s ease-in-out infinite}
.portal-swirl{inset:19% 26%;background:conic-gradient(transparent,#a15bffb0,transparent,#f2bbff,transparent);animation:portal-spin 2.1s linear infinite;filter:blur(.5px)}
.portal-spark{position:absolute;z-index:1;left:50%;top:50%;background:#fff0ff;width:3px;height:3px;border-radius:50%;box-shadow:0 0 5px #f0a2ff;transform:rotate(var(--angle)) translateX(5px);animation:portal-particle 1.7s var(--delay) ease-out infinite}
@keyframes portal-particle{from{transform:rotate(var(--angle)) translateX(7px) scale(.5);opacity:1}to{transform:rotate(var(--angle)) translateX(24px) scale(0);opacity:0}}
@keyframes portal-breathe{50%{opacity:.81;scale:.93 1.03}}
@keyframes portal-spin{to{rotate:360deg}}

function drawTrail(){

  map.onscroll=()=>{

    const button=document.createElement('button');
    button.className='journey-stop';
    const complete=Boolean(stars[i])||i<unlocked;
    const active=i===unlocked;
    if(complete)button.classList.add('lit');
    if(active)button.classList.add('next');
    if(milestones.includes(i))button.classList.add('milestone');
    button.disabled=i>unlocked;
    button.style.setProperty('--stop-x',anchors[i][0]+'%');
    button.style.setProperty('--stop-y',anchors[i][1]+'%');
    button.style.setProperty('--stop-size',String(1-i*.012));
    button.setAttribute('aria-label','Livello '+(i+1)+(complete?' completato':active?' disponibile':' bloccato'));
    button.innerHTML='<span class="stop-star" aria-hidden="true">★</span><small>'+(i+1)+'</small>';

  }

  actor.innerHTML=pipArt();

    map.scrollTo({top:el.offsetTop-map.clientHeight*.64,behavior});
  }

      const before=actor.getBoundingClientRect();
      mount(unlocked);

      }

      setTimeout(()=>actor.classList.remove('travelling'),1420);
    });
  }else requestAnimationFrame(()=>center(unlocked,'instant'));
}

function goGarden(){lobbyTab='home';mapPage=Math.floor(unlocked/5);if(locked&&!$('overlay').hidden)locked=false;if(locked)return;$('overlay').hidden=true;$('playScreen').hidden=true;$('garden').hidden=false;gardenArt()}function goPlay(i){if(!LEVELS[i]||i>unlocked)return;level=i;$('playScreen').dataset.gate=i===4?'snow':i===9?'stars':''; $('playScreen').dataset.theme=WORLDS[Math.floor(i/5)].theme;$('garden').hidden=true;$('playScreen').hidden=false;reset();window.scrollTo?.(0,0);requestAnimationFrame(()=>at(LEVELS[level].s))}function gardenMap(){modal('Mappa del viaggio','Bosco 1–5 · Vette 6–10 · Cielo stellato 11–15',()=>{$('overlay').hidden=true},'Chiudi');let row=document.createElement('div');row.className='maplist';STAGE_NAMES.forEach((n,i)=>{let bt=document.createElement('button');bt.disabled=i>unlocked;bt.innerHTML='<span>'+String(i+1).padStart(2,'0')+' · '+n+'</span><small>'+(stars[i]?stars[i]+'/3 stelle':i>unlocked?'Bloccato':'Pronto')+'</small>';bt.onclick=()=>goPlay(i);row.append(bt)});$('extra').append(row)}function gardenMissions(){modal('Traguardi','Obiettivi permanenti, senza scadenze.',()=>{$('overlay').hidden=true},'Chiudi');let el=document.createElement('div');el.className='maplist';for(let [n,v,t] of [['Primi passi',completed(),5],['Esploratore',completed(),10],['Custode del bosco',completed(),20],['Maestro dei puzzle',totalStars(),45]]){let p=document.createElement('p');p.textContent=n+' · '+Math.min(v,t)+'/'+t;el.append(p)}$('extra').append(el)}$('continueGame').onclick=()=>goPlay(unlocked);$('mapNav').onclick=()=>showLobby('home');$('collectionNav').onclick=()=>showLobby('mochi');$('shopNav').onclick=()=>showLobby('shop');$('returnHome').onclick=goGarden;
reset();applyArt();goGarden();try{if(!localStorage.getItem('mochi-story-intro-v1')&&unlocked===0){
  goPlay(0);
  modal('Il Portale di Casa','Una tempesta ha frantumato il portale e disperso i tuoi amici nel Bosco e sulle Vette. Parti con Pip, ritrovali e riapri la via di casa.',()=>{
    modal('Apri il sentiero','Scegli un pezzo e tocca una casella libera. Puoi anche trascinarlo direttamente sulla griglia. Completa una riga o una colonna per aprire il portale.',()=>{
      try{localStorage.setItem('mochi-story-intro-v1','1')}catch{}
      $('overlay').hidden=true;$('hint').click()
    },'Prova la prima mossa')
  },'Inizia il viaggio')
}}catch{};
if(!Object.keys(ASSETS).length)fetch('art/sprites.json').then(r=>r.ok?r.json():Promise.reject()).then(a=>{ASSETS=a;applyArt()}).catch(()=>{});
