/* Premium UI pass: live components, not a flattened screenshot. */
#playScreen{padding:6px 6.5% 10px;gap:6px;background-size:cover}
#playScreen .brand{height:clamp(48px,8.5dvh,75px);margin:0 -6%}
#playScreen .corner{top:5px;min-width:36px;min-height:36px}
#playScreen #stageBanner{margin:0 2%;padding:5px 8px}
#stageBanner:before,#stageBanner:after{content:'';display:inline-block;width:22px;height:20px;vertical-align:middle;background:var(--foliage) center/contain no-repeat;margin:0 5px}
#playScreen header{margin:0 -3%;align-items:center}
#playScreen header .badge{min-height:55px;flex:1;border-radius:20px}
#moves strong{font-size:clamp(29px,7vw,42px);line-height:1}
#level:after{content:'';width:24px;height:28px;flex-shrink:0;background:var(--mochi-art) center/contain no-repeat}
.scorePanel{position:relative;padding-top:12px}
#liveStars{position:absolute;z-index:2;top:0;left:0;right:0;display:flex;justify-content:center;gap:3px}
#liveStars img{width:24%;max-width:29px;filter:drop-shadow(0 2px 2px #78440088)}
.scorePanel .game-progress{height:19px;border:3px solid #fff4d1;box-shadow:0 2px #9d6a35,inset 0 2px 4px #55452d}
.scorePanel .game-progress i{background:linear-gradient(#d4ff75,#62cf14 40%,#319b09 80%,#a6ef44)}
#playScreen .board-wrap{padding:6px;margin:2px 0;border-radius:24px}
#playScreen #board{gap:2px;padding:3px;background:#48632b}
#playScreen #status{margin-top:0;border-radius:18px 18px 0 0;background:#fff0d6;padding:6px 9px}
#playScreen .tray{margin-top:-6px;border-radius:0 0 22px 22px;padding:21px 6px 8px;background:linear-gradient(#fff0d6,#efd1a0)}
#playScreen .tray:before{top:1px;background:none;font-size:13px;font-weight:900}
#playScreen .piece{height:clamp(53px,10dvh,83px);border-radius:16px}
#playScreen .controls{margin:3px -4% 0}
#playScreen .controls button,#returnHome{display:flex!important;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px #89633c,inset 0 2px #fff9e8,0 5px 7px #34260d44}
#playScreen #hint{background:linear-gradient(#c6ff67,#6bd820 38%,#38a906 75%,#73d82a);color:white;text-shadow:0 1px 2px #245e17}
.premium-icon{width:19px;height:19px;object-fit:contain;flex-shrink:0}
#playScreen footer{opacity:1;font-size:0}
#playScreen .homeBack{font-size:14px;padding:5px 14px;border-radius:24px}
#overlay.victory{background:#24371525;padding:16px}
#overlay.victory .modal{position:relative;overflow:visible;width:min(330px,91vw);padding:62px 17px 20px;margin-top:55px;background:var(--flowers) bottom left/90px auto no-repeat,var(--flowers) bottom right/90px auto no-repeat,linear-gradient(#fff8df,#ffe9b8);border:4px solid #fff5d4;box-shadow:0 0 0 2px #c38b3b,0 7px #ad7843,0 14px 28px #39250d66;animation:premiumEnter .35s ease-out}
#overlay.victory #modalArt{position:absolute;top:-85px;height:145px;left:0;right:0;background:var(--foliage) bottom left/46% auto no-repeat,var(--foliage) bottom right/46% auto no-repeat,radial-gradient(ellipse,#ffe85f99,transparent 65%);pointer-events:none}
#overlay.victory .win-art{width:120px;height:120px;animation:premiumHop 1.4s infinite ease-in-out;filter:drop-shadow(0 0 10px #ffe977)}
#overlay.victory h2{position:relative;margin:0 -25px 10px;padding:12px 5px;background:linear-gradient(#fff5cf,#f6c577);border:2px solid #ac7138;border-radius:50% 50% 18% 18%/22% 22% 15% 15%;box-shadow:0 4px #b57e3d,inset 0 2px #fff8df;font-size:clamp(25px,8vw,38px);font-weight:1000}
#overlay.victory p{font-size:15px;font-weight:850;margin:12px 0;color:#694022}
#overlay.victory .star-result{gap:9px;margin:15px 0}
.star-result img{width:24%;max-width:63px;filter:drop-shadow(0 3px 2px #80491c77);animation:premiumEnter .45s backwards}
.star-result img:nth-child(2){animation-delay:.12s}.star-result img:nth-child(3){animation-delay:.24s}
.star-result img.unearned,#liveStars img.unearned{filter:grayscale(1) brightness(1.15)}
#overlay.victory #ok{border-radius:30px;background:linear-gradient(#fff798,#ffd42a 35%,#ffb400 75%,#ffdc3c);color:#62300d;font-size:24px;font-weight:1000;border:2px solid #a76b1b;box-shadow:inset 0 3px #fffbd4,0 4px #b56e16,0 6px 10px #69401755}
@keyframes premiumEnter{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes premiumHop{50%{transform:translateY(-9px) rotate(-5deg)}}
@media(max-height:700px){#playScreen{gap:4px;padding-top:3px}#playScreen .brand{height:44px}#playScreen header .badge{min-height:43px}#playScreen .piece{height:48px}#playScreen #status{font-size:10px;padding:3px}#playScreen .tray{padding-top:17px}#playScreen .controls button{min-height:32px}}

try{unlocked=Math.max(0,Math.min(LEVELS.length-1,Number(localStorage.getItem('mochi-level-v1'))||0));level=unlocked;const v=JSON.parse(localStorage.getItem('mochi-settings-v02')||'null');if(v)Object.assign(settings,v)}catch(e){}
let stars={};try{stars=JSON.parse(localStorage.getItem('mochi-stars-v03')||'{}')||{}}catch{};function award(){let min=LEVELS[level].solution.length,v=moves<=min+1?3:moves<=min+3?2:1;stars[level]=Math.max(stars[level]||0,v);try{localStorage.setItem('mochi-stars-v03',JSON.stringify(stars))}catch{}return v}
let audio=null;function initAudio(){if(!settings.sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch{}}document.addEventListener('pointerdown',initAudio,{passive:true});function tone(kind){if(!settings.sound||!audio||audio.state!=='running')return;const seq={place:[420],clear:[523,659,784],win:[523,659,784,1047],invalid:[180]}[kind]||[420];try{seq.forEach((f,i)=>{let t=audio.currentTime+i*.075,o=audio.createOscillator(),a=audio.createGain();o.type='sine';o.frequency.value=f;a.gain.setValueAtTime(.045,t);a.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(a);a.connect(audio.destination);o.start(t);o.stop(t+.14)})}catch{}}function buzz(ms){if(settings.vibration)try{navigator.vibrate?.(ms)}catch{}}function applyArt(){if(ASSETS.cleanYellow)ASSETS.yellow=ASSETS.cleanYellow;if(ASSETS.cleanBunny)ASSETS.newBunny=ASSETS.cleanBunny;if(ASSETS.cleanLogo)ASSETS.newLogo=ASSETS.cleanLogo;if(artURL('forestBackdrop'))document.documentElement.style.setProperty('--forestScene','url('+artURL('forestBackdrop')+')');for(let k of ['green','pink','blue','yellow','purple'])if(artURL(k))document.documentElement.style.setProperty('--tile-'+k,'url('+artURL(k)+')');if(artURL('newLogo'))ASSETS.logo=ASSETS.newLogo;if(artURL('newBunny'))ASSETS.bunny=ASSETS.newBunny;if(artURL('newPortal'))ASSETS.portal=ASSETS.newPortal;if(artURL('bunny'))bunny='<img alt="Mochi" draggable="false" src="'+artURL('bunny')+'">';if(artURL('portal'))portal='<img alt="Portale" draggable="false" src="'+artURL('portal')+'">';if(artURL('logo')){$('gameLogo').src=artURL('logo');$('gameLogo').hidden=false;$('logoFallback').hidden=true}for(let [k,v] of [['bush','--foliage'],['flowers','--flowers']])if(artURL(k))document.documentElement.style.setProperty(v,'url("'+artURL(k)+'")');if(artURL('bunny'))document.documentElement.style.setProperty('--mochi-art','url('+artURL('bunny')+')');if(!locked)draw();gardenArt()}

function path(board){let l=LEVELS[level],q=[l.s],prev=new Map([[l.s,-1]]);for(let i=0;i<q.length;i++){let a=q[i];if(a===l.e){let p=[];while(a!==-1){p.unshift(a);a=prev.get(a)}return p}for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let x=a%6+dx,y=(a/6|0)+dy,n=y*6+x;if(x>=0&&x<6&&y>=0&&y<6&&!board[n]&&!prev.has(n)){prev.set(n,a);q.push(n)}}}return []}
function calc(board,p,a){let l=LEVELS[level],c=SHAPES[p].map(([dx,dy])=>[a%6+dx,(a/6|0)+dy]);if(c.some(([x,y])=>x>=6||y>=6||board[y*6+x]||[l.s,l.e].includes(y*6+x)))return null;let n=board.slice();c.forEach(([x,y])=>n[y*6+x]=1);let clear=new Set();for(let j=0;j<6;j++){for(let line of [Array.from({length:6},(_,k)=>j*6+k),Array.from({length:6},(_,k)=>k*6+j)])if(line.every(k=>n[k]))line.forEach(k=>clear.add(k))}clear.forEach(k=>n[k]=0);return {n,clear}}

function draw(){let l=LEVELS[level];$('stageName').textContent='';$('stageBanner').textContent='Livello '+(level+1)+' · '+STAGE_NAMES[level];let potential=moves<=l.solution.length+1?3:moves<=l.solution.length+3?2:1;$('liveStars').innerHTML=starMarkup(potential);$('undo').disabled=locked||!history.length;$('level').textContent='Libera il percorso di Mochi!';$('moves').innerHTML='<small>Mosse rimanenti</small><strong>'+(12-moves)+'</strong>';$('progressBar').style.width=((12-moves)/12*100)+'%';grid.innerHTML='';b.forEach((v,i)=>{let d=document.createElement('div');d.className='cell'+(v?' block':'');d.dataset.i=i;if(v){let c=colors[(i%6+Math.floor(i/6))%5];d.style.setProperty('--light',c[0]);d.style.setProperty('--dark',c[1]);d.style.setProperty('--edge',c[2]);d.dataset.symbol=['●','★','☾','✿','◆'][(i%6+Math.floor(i/6))%5];d.style.setProperty('--tile','var(--tile-'+['blue','yellow','purple','pink','green'][(i%6+Math.floor(i/6))%5]+')')}if(i===l.e){d.classList.add('portal');d.innerHTML=portal;}grid.append(d)});let hero=document.createElement('div');hero.className='hero';hero.id='hero';hero.innerHTML=bunny;hero.style.filter=currentCostume().filter+' drop-shadow(0 2px 1px #62442c44)';grid.append(hero);at(l.s);tray.innerHTML='';pieces().forEach((p,i)=>{let btn=document.createElement('button');btn.className='piece'+(i===selected?' selected':'');btn.disabled=used.includes(i)||locked;btn.setAttribute('aria-label','Pezzo '+(i+1));if(!used.includes(i))btn.append(shape(p));else btn.textContent='Usato';btn.onclick=()=>{if(performance.now()<ignoreClick||locked)return;selected=i;draw()};btn.onpointerdown=e=>{if(btn.disabled)return;selected=i;drag={i,x:e.clientX,y:e.clientY};btn.setPointerCapture(e.pointerId)};btn.onpointermove=e=>{if(!drag||drag.i!==i)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){let g=$('ghost');if(g.hidden){g.replaceChildren(shape(p));g.hidden=false}g.style.left=e.clientX-25+'px';g.style.top=e.clientY-25+'px'}};btn.onpointerup=e=>{if(!drag)return;let g=$('ghost'),was=!g.hidden;g.hidden=true;drag=null;if(was){ignoreClick=performance.now()+400;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(target)place(+target.dataset.i);else draw()}};btn.onpointercancel=()=>{drag=null;$('ghost').hidden=true};tray.append(btn)})}
function at(i){let h=$('hero'),c=grid.querySelector('[data-i="'+i+'"]');if(h&&c){h.style.width=c.offsetWidth+'px';h.style.transform='translate('+c.offsetLeft+'px,'+c.offsetTop+'px)'}}

function starMarkup(n){let url=artURL('rewardStar')||'data:image/svg+xml,'+encodeURIComponent("<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><defs><linearGradient id=\"gold\" x2=\".3\" y2=\"1\"><stop stop-color=\"#fff9ac\"/><stop offset=\".45\" stop-color=\"#ffdb42\"/><stop offset=\"1\" stop-color=\"#f6a31c\"/></linearGradient></defs><path d=\"M50 7Q53 6 55 12L65 33 89 37Q97 38 91 45L74 62 78 85Q80 94 72 90L50 79 28 90Q20 94 22 85L26 62 9 45Q3 38 11 37L35 33 45 12Q47 6 50 7Z\" fill=\"url(#gold)\" stroke=\"#a86422\" stroke-width=\"5\" stroke-linejoin=\"round\"/><path d=\"M50 15L39 39 15 43 33 60 29 82 50 71 71 82 67 60 85 43 61 39Z\" fill=\"none\" stroke=\"#fff4a5\" stroke-width=\"3\" stroke-linejoin=\"round\"/><path d=\"M49 21L41 40 22 44\" fill=\"none\" stroke=\"white\" stroke-opacity=\".85\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>");return url?[1,2,3].map(i=>'<img alt="'+(i<=n?'Stella ottenuta':'Stella non ottenuta')+'" class="'+(i>n?'unearned':'')+'" src="'+url+'">').join(''):'★'.repeat(n)+'☆'.repeat(3-n)}

async function place(i){if(locked||!$('overlay').hidden||used.includes(selected)||moves>=12)return;let r=calc(b,pieces()[selected],i);if(!r){say('Il pezzo non entra qui.');tone('invalid');return}let placed=SHAPES[pieces()[selected]].map(([dx,dy])=>i+dx+dy*6);history.push({b:b.slice(),used:used.slice(),selected,moves});locked=true;moves++;used.push(selected);if(used.length===3)used=[];selected=[0,1,2].find(i=>!used.includes(i));placed.forEach(k=>b[k]=1);draw();for(let k of placed)grid.querySelector('[data-i="'+k+'"]').classList.add('placed');tone('place');if(r.clear.size){await new Promise(r=>setTimeout(r,95));tone('clear');buzz(18);for(let k of r.clear){grid.querySelector('[data-i="'+k+'"]').classList.add('clear');particles(k)}await new Promise(r=>setTimeout(r,275))}else await new Promise(r=>setTimeout(r,120));b=r.n;draw();let p=path(b);if(p.length){say('Percorso libero!');$('hero').classList.add('run');for(let k of p){grid.querySelector('[data-i="'+k+'"]').classList.add('path');particles(k);at(k);await new Promise(r=>setTimeout(r,180))}tone('win');buzz([25,45,30]);let earned=award(),last=level===LEVELS.length-1;unlocked=Math.max(unlocked,Math.min(LEVELS.length-1,level+1));try{localStorage.setItem('mochi-level-v1',String(unlocked));if(last)localStorage.setItem('mochi-complete-v02','1')}catch(e){}modal(last?'Tutti salvi!':'Mochi è libero!',last?'Hai completato le venti stanze. Puoi rigiocare ogni livello.':'Hai liberato Mochi in '+moves+' '+(moves===1?'mossa':'mosse')+'.',()=>{level=last?0:level+1;reset()},last?'Ricomincia':'Prossimo livello',true);$('extra').innerHTML='<div class="star-result" aria-label="'+earned+' stelle">'+starMarkup(earned)+'</div>';return}locked=false;draw();if(moves>=12||!pieces().some((p,i)=>!used.includes(i)&&b.some((_,a)=>calc(b,p,a)))){locked=true;modal('Riprova','Non ci sono più mosse utili. Puoi riprovare senza perdere i tuoi livelli.',reset,'Riprova')}else say(r.clear.size?'Ottima mossa! Linea eliminata.':'Completa una riga o una colonna.')}

$('restart').onclick=()=>{if(!locked&&$('overlay').hidden)reset()};
let hintBusy=false;async function solveHint(board,mask,max){let q=[{b:board.slice(),mask,first:null}],seen=new Set([board.join('')+':'+mask]),count=0;for(let depth=0;depth<max;depth++){let next=[];for(let z of q){if(++count>7000||next.length>14000)return {limited:true};if(count%70===0)await new Promise(r=>setTimeout(r,0));for(let k=0;k<3;k++){if(z.mask&(1<<k))continue;for(let a=0;a<36;a++){let r=calc(z.b,pieces()[k],a);if(!r)continue;let first=z.first||[k,a];if(path(r.n).length)return {first};let m=z.mask|(1<<k);if(m===7)m=0;let key=r.n.join('')+':'+m;if(!seen.has(key)){seen.add(key);next.push({b:r.n,mask:m,first})}}}}q=next;if(!q.length)break}return {first:null}}
$('hint').onclick=async()=>{if(locked||hintBusy||!$('overlay').hidden)return;hintBusy=true;let snap=b.join(''),lev=level,m=moves,mask=used.reduce((a,k)=>a|(1<<k),0);$('hint').disabled=true;say('Cerco un percorso risolvibile…');try{let r=await solveHint(b,mask,12-moves);if(lev!==level||m!==moves||snap!==b.join('')||locked||!$('overlay').hidden)return;if(r.first){selected=r.first[0];draw();grid.querySelector('[data-i="'+r.first[1]+'"]').classList.add('hinted');say('Questa mossa fa parte di una soluzione valida.')}else say(r.limited?'Ricerca limitata: prova un’altra mossa o riprova.':'Non esiste una soluzione nelle mosse rimanenti. Riprova gratuitamente.')}finally{hintBusy=false;$('hint').disabled=false}};
$('help').onclick=()=>{if(locked)return;modal('Come si gioca','Scegli o trascina un pezzo. Completa righe o colonne per liberare un percorso da Mochi al portale in 12 mosse.',()=>{$('overlay').hidden=true},'Torna al gioco');let row=document.createElement('div');row.className='settings-row';for(let [key,label] of [['sound','Audio'],['vibration','Vibrazione']]){let bt=document.createElement('button');let sync=()=>bt.textContent=label+': '+(settings[key]?'ON':'OFF');sync();bt.onclick=()=>{settings[key]=!settings[key];try{localStorage.setItem('mochi-settings-v02',JSON.stringify(settings))}catch{}sync()};row.append(bt)}$('extra').append(row)};
$('levels').onclick=()=>{if(!locked)gardenMap()};window.addEventListener('resize',()=>{if(!locked)at(LEVELS[level].s)});const STAGE_NAMES=["Il primo sentiero","Portale tra le foglie","Radura dei fiori","Il ponte nascosto","La tana di Mochi","Sotto le felci","Il labirinto verde","Il sentiero dei funghi","La quercia antica","La radura segreta","Il ruscello","Pietre muschiose","Il bosco fitto","L'angolo delle lucciole","La grande felce","Il sentiero dorato","La cascata nascosta","La radura dei desideri","L'ultimo ostacolo","Il portale del bosco"], COSTUMES=[{n:'Mochi',rank:0,filter:'none',desc:'Il piccolo esploratore originale'},{n:'Mochi Primavera',rank:5,filter:'sepia(.25) hue-rotate(36deg)',desc:'Tema primavera'},{n:'Mochi Aurora',rank:10,filter:'sepia(.25) hue-rotate(285deg)',desc:'Tema aurora'},{n:'Mochi Luna',rank:20,filter:'sepia(.22) hue-rotate(155deg)',desc:'Tema lunare'}];let history=[],costume=0;try{costume=Math.max(0,Math.min(3,Number(localStorage.getItem('mochi-costume-v101'))||0))}catch{};function completed(){return Math.max(unlocked,Object.keys(stars).filter(k=>stars[k]>0).length,(()=>{try{return localStorage.getItem('mochi-complete-v02')==='1'&&unlocked>=LEVELS.length-1?LEVELS.length:0}catch{return 0}})())}function totalStars(){return Object.values(stars).reduce((a,b)=>a+(Number(b)||0),0)}function currentCostume(){return COSTUMES[costume]?.rank<=completed()?COSTUMES[costume]:COSTUMES[0]}let mapPage=0;function drawTrail(){let m=$('trailmap');m.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M18 86 Q80 86 82 68 T18 48 T82 27 T18 9" fill="none" stroke="#e9cc8c" stroke-width="9" stroke-linecap="round"/><path d="M18 86 Q80 86 82 68 T18 48 T82 27 T18 9" fill="none" stroke="#fff0c0" stroke-width="5" stroke-linecap="round"/></svg>';let coords=[[18,86],[50,84],[82,70],[50,60],[18,48],[50,39],[82,27],[50,19],[18,9],[82,9]];for(let j=0;j<10;j++){let i=mapPage*10+j,bt=document.createElement('button');bt.style.left=coords[j][0]+'%';bt.style.top=coords[j][1]+'%';bt.disabled=i>unlocked;bt.classList.toggle('next',i===unlocked);bt.innerHTML=(i+1)+'<small>'+(stars[i]?'★'.repeat(stars[i]):i>unlocked?'Bloccato':'Gioca')+'</small>';bt.setAttribute('aria-label',STAGE_NAMES[i]);bt.onclick=()=>goPlay(i);m.append(bt)}$('mapRange').textContent='Sentieri '+(mapPage*10+1)+'–'+(mapPage*10+10);$('prevMap').disabled=mapPage===0;$('nextMap').disabled=mapPage===1} $('prevMap').onclick=()=>{mapPage=0;drawTrail()};$('nextMap').onclick=()=>{mapPage=1;drawTrail()};$('worldOne').onclick=()=>{mapPage=Math.floor(unlocked/10);drawTrail()};function gardenArt(){drawTrail();let logo=artURL('logo'),pet=artURL('bunny');if(logo){$('gardenLogo').src=logo;$('gardenTitle').hidden=true}else $('gardenLogo').hidden=true;if(pet){$('gardenPet').src=pet;$('gardenPet').hidden=false}else $('gardenPet').hidden=true;$('gardenPet').style.filter=currentCostume().filter+' drop-shadow(0 8px 3px #85704b35)';$('gardenPetName').textContent=currentCostume().n;$('gardenRank').textContent='Maestria '+(1+Math.floor(totalStars()/5))+' · Esploratore del bosco';$('gardenStats').textContent=completed()+'/20 stanze · '+totalStars()+'/60 stelle';$('continueGame').textContent='Gioca · '+(unlocked+1)}function goGarden(){mapPage=Math.floor(unlocked/10);if(locked&&!$('overlay').hidden)locked=false;if(locked)return;$('overlay').hidden=true;$('playScreen').hidden=true;$('garden').hidden=false;gardenArt()}function goPlay(i){level=i;$('garden').hidden=true;$('playScreen').hidden=false;reset();requestAnimationFrame(()=>at(LEVELS[level].s))}function gardenMap(){modal('Bosco dei Mochi','20 sentieri · completa una stanza per sbloccare la successiva.',()=>{$('overlay').hidden=true},'Chiudi');let row=document.createElement('div');row.className='maplist';STAGE_NAMES.forEach((n,i)=>{let bt=document.createElement('button');bt.disabled=i>unlocked;bt.innerHTML='<span>'+String(i+1).padStart(2,'0')+' · '+n+'</span><small>'+(stars[i]?stars[i]+'/3 stelle':i>unlocked?'Bloccato':'Pronto')+'</small>';bt.onclick=()=>goPlay(i);row.append(bt)});$('extra').append(row)}function gardenCollection(){modal('Collezione','Temi cosmetici del Mochi originale. Si sbloccano giocando.',()=>{$('overlay').hidden=true},'Chiudi');let row=document.createElement('div');row.className='collectionCards';COSTUMES.forEach((v,i)=>{let bt=document.createElement('button');bt.disabled=completed()<v.rank;bt.classList.toggle('active',costume===i);bt.innerHTML='<img alt="" src="'+artURL('bunny')+'" style="filter:'+v.filter+'"><strong>'+v.n+'</strong><small>'+ (bt.disabled?'Salva '+v.rank+' stanze':v.desc)+'</small>';bt.onclick=()=>{costume=i;try{localStorage.setItem('mochi-costume-v101',String(i))}catch{}gardenArt();gardenCollection()};row.append(bt)});$('extra').append(row)}function gardenMissions(){modal('Traguardi','Obiettivi permanenti, senza scadenze.',()=>{$('overlay').hidden=true},'Chiudi');let el=document.createElement('div');el.className='maplist';for(let [n,v,t] of [['Primi passi',completed(),5],['Esploratore',completed(),10],['Custode del bosco',completed(),20],['Maestro dei puzzle',totalStars(),45]]){let p=document.createElement('p');p.textContent=n+' · '+Math.min(v,t)+'/'+t;el.append(p)}$('extra').append(el)}$('continueGame').onclick=()=>goPlay(unlocked);$('mapNav').onclick=gardenMap;$('collectionNav').onclick=gardenCollection;$('missionsNav').onclick=gardenMissions;$('settingsNav').onclick=()=>$('help').click();$('returnHome').onclick=goGarden;$('undo').onclick=()=>{if(locked||!history.length||!$('overlay').hidden)return;let v=history.pop();b=v.b;used=v.used;selected=v.selected;moves=v.moves;draw();say('Ultima mossa annullata.')};
reset();applyArt();goGarden();try{if(!localStorage.getItem('mochi-tutorial-v03')&&unlocked===0){localStorage.setItem('mochi-tutorial-v03','1');goPlay(0);modal('Salva Mochi!','Scegli un pezzo, poi tocca una casella libera. Completa una linea per liberare il sentiero. Usa Suggerimento se ti serve aiuto.',()=>{$('overlay').hidden=true;$('hint').click()},'Proviamo')}}catch{};if(!Object.keys(ASSETS).length)fetch('art/sprites.json').then(r=>r.ok?r.json():Promise.reject()).then(a=>{ASSETS=a;applyArt()}).catch(()=>{});
