let audio=null;function initAudio(){if(!settings.sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch{}}document.addEventListener('pointerdown',initAudio,{passive:true});function tone(kind){if(!settings.sound||!audio||audio.state!=='running')return;const seq={place:[420],clear:[523,659,784],win:[523,659,784,1047],invalid:[180]}[kind]||[420];try{seq.forEach((f,i)=>{let t=audio.currentTime+i*.075,o=audio.createOscillator(),a=audio.createGain();o.type='sine';o.frequency.value=f;a.gain.setValueAtTime(.045,t);a.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(a);a.connect(audio.destination);o.start(t);o.stop(t+.14)})}catch{}}function buzz(ms){if(settings.vibration)try{navigator.vibrate?.(ms)}catch{}}function applyArt(){if(artURL('bunny'))bunny='<img alt="Mochi" draggable="false" src="'+artURL('bunny')+'">';if(artURL('portal'))portal='<img alt="Portale" draggable="false" src="'+artURL('portal')+'">';if(artURL('logo')){$('gameLogo').src=artURL('logo');$('gameLogo').hidden=false;$('logoFallback').hidden=true}for(let [k,v] of [['bush','--foliage'],['flowers','--flowers']])if(artURL(k))document.documentElement.style.setProperty(v,'url("'+artURL(k)+'")');if(!locked)draw()}

function path(board){let l=LEVELS[level],q=[l.s],prev=new Map([[l.s,-1]]);for(let i=0;i<q.length;i++){let a=q[i];if(a===l.e){let p=[];while(a!==-1){p.unshift(a);a=prev.get(a)}return p}for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let x=a%6+dx,y=(a/6|0)+dy,n=y*6+x;if(x>=0&&x<6&&y>=0&&y<6&&!board[n]&&!prev.has(n)){prev.set(n,a);q.push(n)}}}return []}
function calc(board,p,a){let l=LEVELS[level],c=SHAPES[p].map(([dx,dy])=>[a%6+dx,(a/6|0)+dy]);if(c.some(([x,y])=>x>=6||y>=6||board[y*6+x]||[l.s,l.e].includes(y*6+x)))return null;let n=board.slice();c.forEach(([x,y])=>n[y*6+x]=1);let clear=new Set();for(let j=0;j<6;j++){for(let line of [Array.from({length:6},(_,k)=>j*6+k),Array.from({length:6},(_,k)=>k*6+j)])if(line.every(k=>n[k]))line.forEach(k=>clear.add(k))}clear.forEach(k=>n[k]=0);return {n,clear}}
function pieces(){return LEVELS[level].pieces}
function shape(p){let s=document.createElement('div');s.className='shape';let cols=1+Math.max(...SHAPES[p].map(c=>c[0])),rows=1+Math.max(...SHAPES[p].map(c=>c[1]));s.style.setProperty('--cols',cols);s.style.setProperty('--rows',rows);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let d=document.createElement('div');if(SHAPES[p].some(c=>c[0]===x&&c[1]===y))d.className='mini';s.append(d)}return s}
function draw(){let l=LEVELS[level];$('level').textContent='Livello '+(level+1);$('moves').textContent='Mosse: '+(12-moves)+'/12';$('progressBar').style.width=((unlocked+1)/LEVELS.length*100)+'%';grid.innerHTML='';b.forEach((v,i)=>{let d=document.createElement('div');d.className='cell'+(v?' block':'');d.dataset.i=i;if(v){let c=colors[(i%6+Math.floor(i/6))%5];d.style.setProperty('--light',c[0]);d.style.setProperty('--dark',c[1]);d.style.setProperty('--edge',c[2])}if(i===l.e){d.classList.add('portal');d.innerHTML=portal;}grid.append(d)});let hero=document.createElement('div');hero.className='hero';hero.id='hero';hero.innerHTML=bunny;grid.append(hero);at(l.s);tray.innerHTML='';pieces().forEach((p,i)=>{let btn=document.createElement('button');btn.className='piece'+(i===selected?' selected':'');btn.disabled=used.includes(i)||locked;btn.setAttribute('aria-label','Pezzo '+(i+1));if(!used.includes(i))btn.append(shape(p));else btn.textContent='Usato';btn.onclick=()=>{if(performance.now()<ignoreClick||locked)return;selected=i;draw()};btn.onpointerdown=e=>{if(btn.disabled)return;selected=i;drag={i,x:e.clientX,y:e.clientY};btn.setPointerCapture(e.pointerId)};btn.onpointermove=e=>{if(!drag||drag.i!==i)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){let g=$('ghost');if(g.hidden){g.replaceChildren(shape(p));g.hidden=false}g.style.left=e.clientX-25+'px';g.style.top=e.clientY-25+'px'}};btn.onpointerup=e=>{if(!drag)return;let g=$('ghost'),was=!g.hidden;g.hidden=true;drag=null;if(was){ignoreClick=performance.now()+400;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(target)place(+target.dataset.i);else draw()}};btn.onpointercancel=()=>{drag=null;$('ghost').hidden=true};tray.append(btn)})}
function at(i){let h=$('hero'),c=grid.querySelector('[data-i="'+i+'"]');if(h&&c){h.style.width=c.offsetWidth+'px';h.style.transform='translate('+c.offsetLeft+'px,'+c.offsetTop+'px)'}}
function say(s){$('status').textContent=s}
function reset(){b=LEVELS[level].b.slice();used=[];selected=0;moves=0;locked=false;$('overlay').hidden=true;draw();say('Libera il percorso: scegli un pezzo e completa una riga o una colonna.')}
function modal(t,d,fn,button='Continua',win=false){$('title').textContent=t;$('desc').textContent=d;$('extra').replaceChildren();$('modalArt').innerHTML=win&&artURL('bunny')?'<img class="win-art" src="'+artURL('bunny')+'" alt="Mochi">':'';$('ok').textContent=button;$('ok').onclick=fn;$('overlay').hidden=false}
function particles(k){let cell=grid.querySelector('[data-i="'+k+'"]');if(!cell)return;for(let i=0;i<3;i++){let p=document.createElement('i');p.className='spark';p.style.left=(cell.offsetLeft+cell.offsetWidth*.5)+'px';p.style.top=(cell.offsetTop+cell.offsetHeight*.5)+'px';p.style.setProperty('--sx',(Math.random()*50-25)+'px');p.style.setProperty('--sy',(Math.random()*50-25)+'px');grid.append(p);setTimeout(()=>p.remove(),450)}}

async function place(i){if(locked||!$('overlay').hidden||used.includes(selected)||moves>=12)return;let r=calc(b,pieces()[selected],i);if(!r){say('Il pezzo non entra qui.');tone('invalid');return}let placed=SHAPES[pieces()[selected]].map(([dx,dy])=>i+dx+dy*6);locked=true;moves++;used.push(selected);if(used.length===3)used=[];selected=[0,1,2].find(i=>!used.includes(i));placed.forEach(k=>b[k]=1);draw();for(let k of placed)grid.querySelector('[data-i="'+k+'"]').classList.add('placed');tone('place');if(r.clear.size){await new Promise(r=>setTimeout(r,95));tone('clear');buzz(18);for(let k of r.clear){grid.querySelector('[data-i="'+k+'"]').classList.add('clear');particles(k)}await new Promise(r=>setTimeout(r,275))}else await new Promise(r=>setTimeout(r,120));b=r.n;draw();let p=path(b);if(p.length){say('Percorso libero!');$('hero').classList.add('run');for(let k of p){grid.querySelector('[data-i="'+k+'"]').classList.add('path');at(k);await new Promise(r=>setTimeout(r,180))}tone('win');buzz([25,45,30]);let earned=award(),last=level===LEVELS.length-1;unlocked=Math.max(unlocked,Math.min(LEVELS.length-1,level+1));try{localStorage.setItem('mochi-level-v1',String(unlocked));if(last)localStorage.setItem('mochi-complete-v02','1')}catch(e){}modal(last?'Tutti salvi!':'Mochi è libero!',last?'Hai completato le venti stanze. Puoi rigiocare ogni livello.':'Hai liberato Mochi in '+moves+' '+(moves===1?'mossa':'mosse')+'.',()=>{level=last?0:level+1;reset()},last?'Ricomincia':'Prossimo livello',true);$('extra').innerHTML='<div class="star-result" aria-label="'+earned+' stelle">'+[1,2,3].map(i=>'<span style="color:'+(i<=earned?'#d6a32c':'#c8bfa7')+'">&#9733;</span>').join('')+'</div>';return}locked=false;draw();if(moves>=12||!pieces().some((p,i)=>!used.includes(i)&&b.some((_,a)=>calc(b,p,a)))){locked=true;modal('Riprova','Non ci sono più mosse utili. Puoi riprovare senza perdere i tuoi livelli.',reset,'Riprova')}else say(r.clear.size?'Ottima mossa! Linea eliminata.':'Completa una riga o una colonna.')}

grid.onclick=e=>{let d=e.target.closest('.cell');if(d)place(+d.dataset.i)};
$('restart').onclick=()=>{if(!locked&&$('overlay').hidden)reset()};
let hintBusy=false;async function solveHint(board,mask,max){let q=[{b:board.slice(),mask,first:null}],seen=new Set([board.join('')+':'+mask]),count=0;for(let depth=0;depth<max;depth++){let next=[];for(let z of q){if(++count>7000||next.length>14000)return {limited:true};if(count%70===0)await new Promise(r=>setTimeout(r,0));for(let k=0;k<3;k++){if(z.mask&(1<<k))continue;for(let a=0;a<36;a++){let r=calc(z.b,pieces()[k],a);if(!r)continue;let first=z.first||[k,a];if(path(r.n).length)return {first};let m=z.mask|(1<<k);if(m===7)m=0;let key=r.n.join('')+':'+m;if(!seen.has(key)){seen.add(key);next.push({b:r.n,mask:m,first})}}}}q=next;if(!q.length)break}return {first:null}}
$('hint').onclick=async()=>{if(locked||hintBusy||!$('overlay').hidden)return;hintBusy=true;let snap=b.join(''),lev=level,m=moves,mask=used.reduce((a,k)=>a|(1<<k),0);$('hint').disabled=true;say('Cerco un percorso risolvibile…');try{let r=await solveHint(b,mask,12-moves);if(lev!==level||m!==moves||snap!==b.join('')||locked||!$('overlay').hidden)return;if(r.first){selected=r.first[0];draw();grid.querySelector('[data-i="'+r.first[1]+'"]').classList.add('hinted');say('Questa mossa fa parte di una soluzione valida.')}else say(r.limited?'Ricerca limitata: prova un’altra mossa o riprova.':'Non esiste una soluzione nelle mosse rimanenti. Riprova gratuitamente.')}finally{hintBusy=false;$('hint').disabled=false}};
$('help').onclick=()=>{if(locked)return;modal('Come si gioca','Scegli o trascina un pezzo. Completa righe o colonne per liberare un percorso da Mochi al portale in 12 mosse.',()=>{$('overlay').hidden=true},'Torna al gioco');let row=document.createElement('div');row.className='settings-row';for(let [key,label] of [['sound','Audio'],['vibration','Vibrazione']]){let bt=document.createElement('button');let sync=()=>bt.textContent=label+': '+(settings[key]?'ON':'OFF');sync();bt.onclick=()=>{settings[key]=!settings[key];try{localStorage.setItem('mochi-settings-v02',JSON.stringify(settings))}catch{}sync()};row.append(bt)}$('extra').append(row)};
$('levels').onclick=()=>{if(locked)return;modal('Scegli il livello','Le stanze completate rimangono disponibili.',()=>{$('overlay').hidden=true},'Torna al gioco');let row=document.createElement('div');row.className='level-grid';for(let i=0;i<LEVELS.length;i++){let bt=document.createElement('button');bt.textContent=(i+1)+(stars[i]?' · '+stars[i]+'/3':'');bt.disabled=i>unlocked;bt.onclick=()=>{level=i;reset()};row.append(bt)}$('extra').append(row)};window.addEventListener('resize',()=>{if(!locked)at(LEVELS[level].s)});reset();applyArt();try{if(!localStorage.getItem('mochi-tutorial-v03')&&unlocked===0){localStorage.setItem('mochi-tutorial-v03','1');modal('Salva Mochi!','Scegli un pezzo, poi tocca una casella libera. Completa una linea per liberare il sentiero. Usa Suggerimento se ti serve aiuto.',()=>{$('overlay').hidden=true;$('hint').click()},'Proviamo')}}catch{};if(!Object.keys(ASSETS).length)fetch('art/sprites.json').then(r=>r.ok?r.json():Promise.reject()).then(a=>{ASSETS=a;applyArt()}).catch(()=>{});
</script></html>
